  /* ============================================================
     TOKENS — TripleTen DS 1.0
     ============================================================ */
  :root {
    /* Neutrals */
    --white:#FFFFFF; --cream:#F2F1EE; --stone:#E3E1DE;
    --ink:#1A1A1A; --ink-80:#2A2A2A; --black:#000000;
    --grey-50:#A6A6A6;
    --text-primary:var(--ink);
    --text-secondary:rgba(0,0,0,0.50);
    --text-tertiary:rgba(0,0,0,0.40);
    --hairline:rgba(0,0,0,0.14);
    --hairline-inverse:rgba(255,255,255,0.14);
    --text-secondary-inverse:var(--grey-50);

    /* Highlight families — normal / dark / pale / light */
    --red-normal:#ED6F68;   --red-dark:#DE4C45;   --red-pale:#FFCCC9;   --red-light:#F89E93;
    --orange-normal:#E96E3A;--orange-dark:#D35722;--orange-pale:#FFD6C5;--orange-light:#FF976B;
    --yellow-normal:#FFA800;--yellow-dark:#F48E00;--yellow-pale:#FDE3AF;--yellow-light:#FFD078;
    --green-normal:#3AA65E; --green-dark:#328F51; --green-pale:#B8E9C8; --green-light:#6CC989;
    --blue-normal:#3F96F3;  --blue-dark:#1878DC;  --blue-pale:#C5E0FC;  --blue-light:#87BEFA;
    --purple-normal:#A27AFF;--purple-dark:#8754FD;--purple-pale:#E4D9FC;--purple-light:#BFA4FF;

    /* THE deck accent (one family per deck!) — default: orange */
    --accent-normal:var(--orange-normal);
    --accent-dark:var(--orange-dark);
    --accent-pale:var(--orange-pale);
    --accent-light:var(--orange-light);

    /* Type */
    --font-heading:'Gramatika','Suisse Intl',system-ui,sans-serif;
    --font-body:'Suisse Intl',system-ui,sans-serif;

    /* Radius */
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-2xl:24px; --radius-full:9999px;

    /* Spacing (4px base) */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
    --space-6:32px; --space-7:40px; --space-8:48px; --space-9:56px; --space-10:64px;
    --space-11:72px; --space-12:80px;

    --transition:0.4s cubic-bezier(0.4,0,0.2,1);
  }

  /* One-attribute accent theming: <body data-accent="blue"> etc. */
  body[data-accent="red"]    { --accent-normal:var(--red-normal);    --accent-dark:var(--red-dark);    --accent-pale:var(--red-pale);    --accent-light:var(--red-light); }
  body[data-accent="yellow"] { --accent-normal:var(--yellow-normal); --accent-dark:var(--yellow-dark); --accent-pale:var(--yellow-pale); --accent-light:var(--yellow-light); }
  body[data-accent="green"]  { --accent-normal:var(--green-normal);  --accent-dark:var(--green-dark);  --accent-pale:var(--green-pale);  --accent-light:var(--green-light); }
  body[data-accent="blue"]   { --accent-normal:var(--blue-normal);   --accent-dark:var(--blue-dark);   --accent-pale:var(--blue-pale);   --accent-light:var(--blue-light); }
  body[data-accent="purple"] { --accent-normal:var(--purple-normal); --accent-dark:var(--purple-dark); --accent-pale:var(--purple-pale); --accent-light:var(--purple-light); }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:var(--font-body);
    font-weight:400;
    background:var(--ink);
    color:var(--text-primary);
    overflow:hidden;
    height:100vh; width:100vw;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  ::selection { background:var(--ink); color:var(--white); }

  /* ===== SLIDE FRAMEWORK ===== */
  .presentation { width:100vw; height:100vh; position:relative; overflow:hidden; }

  .slide {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding:var(--space-10) var(--space-12);
    background:var(--cream);
    opacity:0; transform:translateX(60px);
    transition:opacity var(--transition), transform var(--transition);
    pointer-events:none;
    overflow-y:auto;
  }
  .slide.active { opacity:1; transform:translateX(0); pointer-events:all; }
  .slide.prev { transform:translateX(-60px); }

  .slide-scrollable { justify-content:flex-start; padding-top:var(--space-8); padding-bottom:var(--space-12); }

  /* Dark emphasis slide (.slide-qa kept as alias) */
  .slide-dark, .slide-qa { background:var(--ink); color:var(--cream); }
  .slide-dark h1, .slide-dark h2, .slide-dark h3,
  .slide-qa h1, .slide-qa h2, .slide-qa h3 { color:var(--cream); }
  .slide-dark p, .slide-qa p { color:var(--text-secondary-inverse); }
  .slide-dark .hl, .slide-qa .hl { color:var(--accent-pale); }
  .slide-dark .small-label, .slide-qa .small-label { color:var(--accent-pale); }

  /* ===== PROGRESS BAR — solid accent, no gradients ===== */
  .progress-bar {
    position:fixed; top:0; left:0; height:4px;
    background:var(--accent-normal);
    transition:width var(--transition);
    z-index:100;
  }

  /* ===== NAVIGATION ===== */
  .nav-controls {
    position:fixed; bottom:var(--space-6); right:var(--space-7);
    display:flex; align-items:center; gap:var(--space-3); z-index:100;
  }
  .nav-btn {
    width:44px; height:44px;
    border-radius:var(--radius-full);
    border:1px solid var(--hairline);
    background:var(--white);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.14s ease;
    font-size:18px; color:var(--text-primary);
    font-family:var(--font-body);
  }
  .nav-btn:hover { background:var(--ink); color:var(--white); border-color:var(--ink); }
  .nav-btn:disabled { opacity:0.3; cursor:default; }
  .slide-counter { font-size:13px; font-weight:500; color:var(--text-tertiary); min-width:48px; text-align:center; }

  /* ===== TYPOGRAPHY — Gramatika display (regular 400), Suisse body ===== */
  h1 {
    font-family:var(--font-heading); font-weight:400;
    font-size:72px; line-height:68px;
    letter-spacing:-0.02em; text-wrap:balance;
    margin-bottom:var(--space-5);
  }
  h2 {
    font-family:var(--font-heading); font-weight:400;
    font-size:48px; line-height:48px;
    letter-spacing:-0.02em; text-wrap:balance;
    margin-bottom:var(--space-6);
  }
  h3 {
    font-family:var(--font-heading); font-weight:400;
    font-size:28px; line-height:32px;
    letter-spacing:-0.01em;
    margin-bottom:var(--space-3);
  }
  h4 { font-family:var(--font-body); font-weight:500; font-size:18px; line-height:24px; margin-bottom:var(--space-2); }

  p, li { font-size:18px; line-height:24px; color:var(--text-secondary); }
  .lead { font-size:24px; line-height:28px; letter-spacing:-0.5px; color:var(--text-primary); }
  .caption { font-size:14px; line-height:18px; color:var(--text-tertiary); }

  /* Headline highlight — accent a word, one accent per deck */
  .hl { color:var(--accent-normal); }
  .hl-body { color:var(--accent-dark); }

  .subtitle { font-size:20px; font-weight:400; color:var(--text-secondary-inverse); margin-bottom:var(--space-2); }
  .subtitle-dim { font-size:15px; opacity:0.5; margin-top:var(--space-2); }

  /* Eyebrow label — sentence case (never ALL-CAPS per DS) */
  .small-label {
    font-size:14px; line-height:18px; font-weight:500;

.cues { list-style: none; }
.cues li {
  font-size: 15px; line-height: 21px; color: var(--ink);
  padding: 7px 0 7px 16px; position: relative;
  border-top: 1px solid var(--hairline);
}
.cues li:first-child { border-top: none; }
.cues li::before { content: ''; position: absolute; left: 0; top: 15px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-normal); }
.cues li em { color: var(--text-secondary); font-style: italic; }
.cues li b { font-weight: 500; }

.listen {
  background: var(--cream); border-radius: var(--radius-md);
  padding: 12px 14px; font-size: 14px; line-height: 19px; color: var(--ink);
}
.listen .ico { font-weight: 500; color: var(--accent-dark); }

.warnbox {
  background: var(--red-pale); border-radius: var(--radius-md);
  padding: 12px 14px; font-size: 13px; line-height: 18px; color: var(--red-dark);
}
.infobox {
  background: var(--blue-pale); border-radius: var(--radius-md);
  padding: 12px 14px; font-size: 13px; line-height: 18px; color: var(--ink);
}

.glyph-note {
  border: 1px solid var(--hairline); border-left: 3px solid var(--accent-normal);
  border-radius: var(--radius-md); padding: 11px 13px;
  font-size: 13px; line-height: 18px; color: var(--text-primary);
  background: var(--white);
}
.glyph-note .gl { display: block; font-size: 11px; font-weight: 500; color: var(--text-tertiary); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }

/* branch chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 500;
  padding: 7px 13px; border-radius: var(--radius-full);
  border: 1px solid var(--hairline); background: var(--white); color: var(--ink);
  cursor: pointer; transition: all .14s ease;
}
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--accent-pale); border-color: transparent; color: var(--accent-dark); }

/* checklist (presenter controls) */
.pchecks { list-style: none; }
.pchecks li {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-top: 1px solid var(--hairline);
  font-size: 14px; color: var(--ink); cursor: pointer;
}
.pchecks li:first-child { border-top: none; }
.pchecks .box {
  width: 20px; height: 20px; flex: none;
  border: 1.5px solid var(--hairline); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
}
.pchecks li.done .box { background: var(--green-normal); border-color: var(--green-normal); color: #fff; }
.pchecks li.done { color: var(--text-tertiary); }

/* form bits */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; font-family: var(--font-body); font-size: 14px; line-height: 20px;
  padding: 9px 12px; color: var(--ink); background: var(--white);
  border: 1px solid var(--hairline); border-radius: var(--radius-sm);
}
.field textarea { resize: vertical; min-height: 76px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--ink); }
.field .hint { font-size: 11.5px; color: var(--text-tertiary); margin-top: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ---------- prep screen ---------- */
.prep { position: fixed; inset: 0; overflow-y: auto; background: var(--cream); }
.prep-inner { max-width: 1080px; margin: 0 auto; padding: 44px 40px 80px; }
.prep h1 { font-size: 52px; line-height: 50px; margin-bottom: 8px; }
.prep-sub { font-size: 17px; color: var(--text-secondary); margin-bottom: 28px; max-width: 620px; }
.prep-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
.panel { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-2xl); padding: 24px 26px; }
.panel h3 { font-size: 22px; margin-bottom: 4px; }
.panel .psub { font-size: 13px; color: var(--text-secondary); margin-bottom: 18px; }
.prep-actions { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
.prep-actions .note { font-size: 12.5px; color: var(--text-tertiary); }
.stepnum {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--ink); color: var(--cream);
  font-family: var(--font-heading); font-size: 13px; margin-right: 9px;
}
.fear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fear-opt {
  text-align: left; cursor: pointer;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--white); padding: 10px 12px;
  font-family: var(--font-body); font-size: 13px; line-height: 17px; color: var(--ink);
  transition: all .14s ease;
}
.fear-opt:hover { border-color: var(--ink); }
.fear-opt.on { background: var(--accent-pale); border-color: transparent; }
.fear-opt .guess { display: block; font-size: 11px; color: var(--accent-dark); font-weight: 500; margin-top: 3px; }

/* ---------- slide-specific components ---------- */
.hero-name { font-size: 68px; line-height: 64px; }
.agenda-3 { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
.agenda-3 span {
  font-size: 15px; font-weight: 500; color: var(--cream);
  background: rgba(255,255,255,.08); border-radius: var(--radius-full);
  padding: 9px 18px;
}
.om-line { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
.om-dot {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent-normal); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-heading); font-size: 19px;
}

.confirm-list { list-style: none; max-width: 780px; }
.confirm-list li {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; margin-bottom: 8px;
  background: var(--white); border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  transition: all .25s ease;
}
.confirm-list li.done { background: var(--green-pale); border-color: transparent; }
.confirm-list .tick {
  width: 28px; height: 28px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--hairline);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: transparent;
}
.confirm-list li.done .tick { background: var(--green-normal); border-color: var(--green-normal); color: #fff; }
.confirm-list .ck { font-size: 13px; color: var(--text-secondary); font-weight: 500; width: 150px; flex: none; }
.confirm-list .cv { font-size: 21px; color: var(--ink); }

.motiv-quote {
  font-family: var(--font-heading); font-weight: 400;
  font-size: 40px; line-height: 46px; letter-spacing: -.01em;
  color: var(--ink); max-width: 1000px; text-wrap: balance;
}
.motiv-quote::before { content: '“'; color: var(--accent-normal); }
.motiv-quote::after { content: '”'; color: var(--accent-normal); }
.motiv-arrow {
  margin-top: 34px; padding-top: 24px;
  border-top: 1px solid var(--hairline);
  max-width: 1000px;
}
.motiv-arrow .ml { font-size: 14px; font-weight: 500; color: var(--accent-dark); margin-bottom: 6px; }
.motiv-arrow .mv { font-size: 30px; line-height: 34px; font-family: var(--font-heading); color: var(--ink); }

.anchor-card {
  background: var(--white); border: 1px solid var(--hairline);
  border-left: 4px solid var(--accent-normal);
  border-radius: var(--radius-lg); padding: 26px 30px; max-width: 900px;
}
.anchor-card p { font-size: 22px; line-height: 30px; color: var(--ink); }
.anchor-skills { display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
.anchor-skills span {
  font-size: 15px; font-weight: 500; padding: 9px 18px;
  border-radius: var(--radius-full); background: var(--accent-pale); color: var(--accent-dark);
}

.fear-head {
  font-size: 15px; font-weight: 500; color: var(--red-dark);
  background: var(--red-pale); border-radius: var(--radius-full);
  padding: 8px 18px; display: inline-block; align-self: flex-start; margin-bottom: 22px;
}
.anti-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1000px; }
.anti-card { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 22px 24px; }
.anti-card h4 { font-size: 19px; font-family: var(--font-heading); font-weight: 400; margin-bottom: 8px; }
.anti-card p { font-size: 16px; line-height: 22px; }

.proof-card { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-2xl); padding: 30px 34px; max-width: 940px; }
.proof-card .pq { font-size: 26px; line-height: 34px; color: var(--ink); font-family: var(--font-heading); font-weight: 400; }
.proof-card .pa { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-top: 16px; }
.placeholder {
  border: 1.5px dashed var(--red-normal); border-radius: var(--radius-lg);
  padding: 26px 28px; max-width: 940px; background: rgba(237,111,104,.06);
}
.placeholder .pl-lbl { font-size: 12px; font-weight: 500; color: var(--red-dark); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.placeholder p { font-size: 17px; line-height: 23px; color: var(--ink); }

.route { display: flex; gap: 0; align-items: stretch; margin-top: 12px; }
.route-step { flex: 1; padding: 0 18px 0 0; position: relative; }
.route-step .rdate { font-size: 13px; font-weight: 500; color: var(--accent-dark); margin-bottom: 8px; }
.route-step .rtitle { font-size: 19px; line-height: 24px; font-family: var(--font-heading); color: var(--ink); margin-bottom: 6px; }
.route-step .rbody { font-size: 14px; line-height: 19px; color: var(--text-secondary); }
.route-step .rdot { width: 13px; height: 13px; border-radius: 50%; background: var(--stone); margin-bottom: 14px; }
.route-step.now .rdot { background: var(--accent-normal); }
.route-step.now .rtitle { color: var(--accent-dark); }
.route-line { height: 2px; background: var(--stone); margin: 6px 0 22px; }

.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
.setup-list { list-style: none; }
.setup-list li {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; margin-bottom: 8px;
  background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-md);
  font-size: 18px; color: var(--ink);
  transition: all .25s ease;
}
.setup-list li.done { background: var(--green-pale); border-color: transparent; }
.setup-list .tick {
  width: 26px; height: 26px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--hairline);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: transparent;
}
.setup-list li.done .tick { background: var(--green-normal); border-color: var(--green-normal); color: #fff; }
.setup-list li .sub { font-size: 13px; color: var(--text-tertiary); display: block; }
.setup-side { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 24px 26px; }
.setup-side h4 { font-family: var(--font-heading); font-weight: 400; font-size: 21px; margin-bottom: 12px; }
.setup-side ol { padding-left: 20px; }
.setup-side li { font-size: 16px; line-height: 24px; color: var(--ink); margin-bottom: 6px; }
.setup-side .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; background: var(--cream); padding: 2px 7px; border-radius: 5px; }

.commit-box {
  background: var(--accent-pale); border-radius: var(--radius-2xl);
  padding: 34px 40px; max-width: 900px;
}
.commit-box .cl { font-size: 15px; font-weight: 500; color: var(--accent-dark); margin-bottom: 12px; }
.commit-box .cv { font-family: var(--font-heading); font-size: 46px; line-height: 50px; color: var(--ink); }
.commit-box .cv.empty { color: rgba(0,0,0,.22); }
.commit-after { margin-top: 26px; font-size: 19px; line-height: 26px; color: var(--ink); max-width: 900px; }

.close-list { list-style: none; margin-top: 28px; }
.close-list li {
  font-size: 19px; line-height: 26px; color: rgba(255,255,255,.85);
  padding: 9px 0 9px 26px; position: relative;
}
.close-list li::before { content: '→'; position: absolute; left: 0; color: var(--accent-pale); }

/* handoff */
.handoff textarea {
  width: 100%; min-height: 210px; font-family: var(--font-body);
  font-size: 13px; line-height: 19px; padding: 13px;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--cream); color: var(--ink); resize: vertical;
}
.handoff .mono-out {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; line-height: 17px; word-break: break-all;
  background: var(--ink); color: var(--cream);
  padding: 12px 14px; border-radius: var(--radius-md);
}
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--cream);
  padding: 11px 20px; border-radius: var(--radius-full);
  font-size: 13px; font-weight: 500; z-index: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.toast.on { opacity: 1; }

/* solo-mode notes drawer */
.drawer {
  position: fixed; right: 0; top: 0; bottom: 0; width: 400px;
  background: var(--white); border-left: 1px solid var(--hairline);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 300; overflow-y: auto; padding: 22px 24px;
}
.drawer.on { transform: translateX(0); }

.kbd {
  font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  background: rgba(255,255,255,.12); color: var(--cream);
  border-radius: 4px; padding: 2px 6px;
}
.hintbar { color: rgba(255,255,255,.4); font-size: 11.5px; display: flex; gap: 14px; flex-wrap: wrap; }

/* live-capture prompt shown when there is no Glyphic summary */
.ask-big {
  font-family: var(--font-heading); font-weight: 400;
  font-size: 40px; line-height: 48px; letter-spacing: -.01em;
  color: rgba(0,0,0,.24); max-width: 1000px;
}
.slide-dark .ask-big { color: rgba(255,255,255,.28); }

.fear-opt-wide { grid-column: 1 / -1; }
.chip-quiet { border-style: dashed; color: var(--text-secondary); }
.chip-quiet.on { border-style: solid; }

/* read-only fields: set centrally, not per call */
.field input:disabled, .field textarea:disabled, .field select:disabled {
  background: var(--cream); color: var(--text-secondary);
  border-color: transparent; cursor: default; -webkit-text-fill-color: var(--text-secondary);
}

/* ============================================================
   Student view on phones and small tablets.
   Below 820px the 1280x720 stage stops being scaled down and
   becomes a fluid, scrollable page instead.
   ============================================================ */
.view-slides.fluid .stage-wrap { position: fixed; inset: 0; display: block; }
.view-slides.fluid .stage {
  width: 100%; height: 100%;
  transform: none !important; left: 0 !important; top: 0 !important;
  position: relative;
}
.view-slides.fluid .stage .slide {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  padding: 30px 20px 40px;
  /* plain `center` makes tall slides overflow past the top edge, where they
     can't be scrolled to. `safe center` centres while it fits and falls back
     to top alignment once it doesn't. flex-start first, for old engines. */
  justify-content: flex-start;
  justify-content: safe center;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.view-slides.fluid .tt-logo-stage { display: none; }   /* it floated over the scroll */

.fluid .small-label { font-size: 11px; margin-bottom: 10px; }
.fluid h1, .fluid .hero-name { font-size: 34px !important; line-height: 36px !important; }
.fluid h2 { font-size: 27px !important; line-height: 31px !important; }

.fluid .agenda-3 { margin-top: 20px; gap: 7px; }
.fluid .agenda-3 span { font-size: 13px; padding: 7px 13px; }
.fluid .om-line { margin-top: 20px; }
.fluid .om-dot { width: 36px; height: 36px; font-size: 16px; }
.fluid .om-line p { font-size: 14px !important; }

.fluid .confirm-list li {
  display: grid; grid-template-columns: 22px 1fr;
  gap: 2px 12px; align-items: start;
  padding: 13px 15px; margin-bottom: 7px;
}
.fluid .confirm-list .tick { width: 22px; height: 22px; font-size: 12px; grid-row: 1 / 3; margin-top: 1px; }
.fluid .confirm-list .ck { width: auto; font-size: 11px; margin: 0; }
.fluid .confirm-list .cv { font-size: 17px; line-height: 22px; margin: 0; }

.fluid .motiv-quote { font-size: 22px; line-height: 28px; }
.fluid .motiv-arrow { margin-top: 20px; padding-top: 16px; }
.fluid .motiv-arrow .mv { font-size: 19px; line-height: 24px; }
.fluid .ask-big { font-size: 24px !important; line-height: 30px !important; }

.fluid .anchor-card { padding: 16px 18px; }
.fluid .anchor-card p { font-size: 16px; line-height: 22px; }
.fluid .anchor-skills { margin-top: 16px; gap: 6px; }
.fluid .anchor-skills span { font-size: 12px; padding: 6px 12px; }

.fluid .fear-head { font-size: 13px; padding: 7px 14px; margin-bottom: 14px; }
.fluid .anti-grid { grid-template-columns: 1fr; gap: 10px; }
.fluid .anti-card { padding: 14px 16px; }
.fluid .anti-card h4 { font-size: 16px; }
.fluid .anti-card p { font-size: 14px; line-height: 19px; }

.fluid .proof-card { padding: 18px 20px; }
.fluid .proof-card .pq { font-size: 17px; line-height: 24px; }
.fluid .proof-card .pa { font-size: 13px; margin-top: 10px; }
.fluid .placeholder { padding: 16px 18px; }
.fluid .placeholder p { font-size: 14px; line-height: 19px; }

.fluid .route { flex-direction: column; gap: 14px; }
.fluid .route-step { padding: 0; display: grid; grid-template-columns: 16px 1fr; gap: 0 10px; }
.fluid .route-step .rdot { grid-row: 1 / 4; margin: 5px 0 0; width: 10px; height: 10px; }
.fluid .route-step .rdate { font-size: 12px; margin-bottom: 2px; }
.fluid .route-step .rtitle { font-size: 16px; line-height: 20px; margin-bottom: 2px; }
.fluid .route-step .rbody { font-size: 13px; line-height: 17px; }

.fluid .setup-grid { grid-template-columns: 1fr; gap: 14px; }
.fluid .setup-list li { padding: 10px 13px; font-size: 14px; gap: 10px; }
.fluid .setup-list .tick { width: 21px; height: 21px; font-size: 12px; }
.fluid .setup-list li .sub { font-size: 11px; }
.fluid .setup-side { padding: 16px 18px; }
.fluid .setup-side h4 { font-size: 17px; margin-bottom: 8px; }
.fluid .setup-side li { font-size: 14px; line-height: 20px; }

.fluid .commit-box { padding: 20px 22px; }
.fluid .commit-box .cl { font-size: 13px; }
.fluid .commit-box .cv { font-size: 28px; line-height: 32px; }

.fluid .close-list { margin-top: 18px; }
.fluid .close-list li { font-size: 15px; line-height: 21px; padding: 6px 0 6px 20px; }

/* bottom fade while a fluid slide still has content below the fold */
.view-slides.fluid .slide.has-more::after {
  content: ''; position: fixed; left: 0; right: 0; bottom: 0; height: 56px;
  background: linear-gradient(to bottom, rgba(242,241,238,0), var(--cream));
  pointer-events: none;
}
.view-slides.fluid .slide.slide-dark.has-more::after {
  background: linear-gradient(to bottom, rgba(26,26,26,0), var(--ink));
}

/* read-only value that must be readable in full, no scrolling */
.readonly-block {
  background: var(--cream); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 14px; line-height: 20px; color: var(--text-secondary);
}

/* attribution with an avatar on the success-story slide */
.proof-card .pby { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
.proof-card .pavatar {
  width: 56px; height: 56px; flex: none; border-radius: 50%; overflow: hidden;
  background: var(--accent-pale); color: var(--accent-dark);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-heading); font-size: 20px; letter-spacing: .02em;
}
.proof-card .pavatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.proof-card .pname { font-size: 17px; font-weight: 500; color: var(--ink); }
.proof-card .prole { font-size: 14px; color: var(--text-secondary); }

/* story picker on the prep screen: full text, nothing hidden */
.story-opt {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid var(--hairline); border-radius: var(--radius-md);
  background: var(--white); padding: 13px 15px 14px; margin-bottom: 9px;
  font-family: var(--font-body); transition: all .14s ease;
}
.story-opt:hover { border-color: var(--ink); }
.story-opt.on { background: var(--accent-pale); border-color: transparent; }
.so-head { display: flex; align-items: center; gap: 11px; margin-bottom: 9px; }
.so-avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%; overflow: hidden;
  background: var(--accent-pale); color: var(--accent-dark);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-heading); font-size: 14px;
}
.story-opt.on .so-avatar { background: var(--white); }
.so-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.so-name { font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 18px; }
.so-role { font-size: 12px; color: var(--text-tertiary); line-height: 16px; }
.so-text { font-size: 13px; line-height: 18px; color: var(--text-secondary); }
.story-opt.on .so-text { color: var(--ink); }

.fluid .proof-card .pby { gap: 10px; margin-top: 16px; }
.fluid .proof-card .pavatar { width: 42px; height: 42px; font-size: 15px; }
.fluid .proof-card .pname { font-size: 14px; }
.fluid .proof-card .prole { font-size: 12px; }

/* LinkedIn mark beside a graduate's name */
.li-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 17px; height: 17px; margin-left: 8px; vertical-align: -3px;
  color: var(--text-tertiary); transition: color .14s ease;
}
.li-mark svg { width: 100%; height: 100%; display: block; }
.li-mark:hover { color: var(--ink); }
.li-mark.li-sm { width: 14px; height: 14px; margin-left: 6px; vertical-align: -2px; }
.story-opt.on .li-mark { color: var(--accent-dark); }
.fluid .li-mark { width: 14px; height: 14px; margin-left: 6px; }

/* action bar: every button keeps to one line, the hint sits below */
.prep-actions { flex-wrap: nowrap; align-items: center; }
.prep-actions .btn { white-space: nowrap; flex: none; }
.prep-foot { font-size: 12.5px; color: var(--text-tertiary); margin-top: 10px; }

/* a single antidote card shouldn't stretch across the slide */
.anti-grid.one { grid-template-columns: minmax(0, 520px); }

/* the two Glyphic fields the student actually sees, called out as a group */
.onscreen {
  border: 1px solid var(--accent-normal); border-radius: var(--radius-md);
  padding: 13px 14px 14px; margin-bottom: 14px; background: var(--white);
}
.onscreen-hd {
  font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent-dark); margin-bottom: 6px;
}
.onscreen-note { font-size: 12.5px; line-height: 17px; color: var(--text-secondary); margin-bottom: 13px; }

/* Glyphic fields hold several sentences — show them without scrolling */
.panel .field textarea#fBackground,
.panel .field textarea#fMotivation,
.panel .field textarea#fAnchor,
.panel .field textarea#fFears { min-height: 132px; }

</style>

/* ------------------------------------------------------------- utilities */

function isoPlus(days) {
  const d = new Date(); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function enDate(iso, opts) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('es-MX', opts || { month: 'long', day: 'numeric' });
}
function enDateShort(iso) { return enDate(iso, { weekday: 'long', month: 'long', day: 'numeric' }); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function deaccent(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function qs(k) { return new URLSearchParams(location.search).get(k); }
function fearById(id) { return FEARS.find(f => f.id === id) || null; }
function storiesFor(s) { return STORIES[s.program] || []; }
function initials(name) {
  return String(name || '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function storyFor(s) { return storiesFor(s)[s.storyIdx || 0] || null; }

function deck() { return SLIDES.filter(x => x.id !== 'proof' || storiesFor(S.student).length); }

/* Glyphic summary → fields. Handles both label sets, and finds the labels
   anywhere in the text — a summary copied out of Glyphic often arrives as one
   paragraph with no line breaks at all. */
const GLYPHIC_LABELS = [
  ['background', 'background|antecedentes'],
  ['motivation', 'motivation|motivaci[oó]n'],
  ['fearsRaw',   'fears\\s*\\/?\\s*concerns|concerns|worries|miedos\\s*\\/?\\s*preocupaciones|miedos|preocupaciones'],
  ['decision',   'purchase decision|decisi[oó]n de compra'],
  ['anchor',     'confidence anchor|point of confidence|punto de apoyo para la confianza|punto de apoyo']
];

function parseGlyphic(text) {
  const src = String(text || '').replace(/\r/g, '');
  const any = GLYPHIC_LABELS.map(l => l[1]).join('|');
  const finder = new RegExp('(?:^|[\\s*>•\\-–])(' + any + ')\\s*:', 'gi');

  const hits = [];
  let m;
  while ((m = finder.exec(src)) !== null) {
    const word = m[1].toLowerCase();
    const key = (GLYPHIC_LABELS.find(([, re]) => new RegExp('^(?:' + re + ')$', 'i').test(word)) || [])[0];
    if (key) hits.push({ key, from: m.index, to: finder.lastIndex });
  }

  const out = {};
  hits.forEach((h, i) => {
    const body = src.slice(h.to, i + 1 < hits.length ? hits[i + 1].from : src.length);
    out[h.key] = body.replace(/[\s*>•\-–]+/g, ' ').trim();
  });
  return out;
}

function guessFear(text) {
  const t = deaccent(text || '');
  let best = null, bestScore = 0;
  for (const f of FEARS) {
    let score = 0;
    for (const k of f.kw) if (t.includes(deaccent(k))) score++;
    if (score > bestScore) { bestScore = score; best = f; }
  }
  return bestScore ? best.id : null;
}

function lcFirst(t) { t = String(t || ''); return t.charAt(0).toLowerCase() + t.slice(1); }

const stageHTML = (s, i) => {
  const list = deck();
  const body = (list[i] || list[0]).render(s);
  const dark = /slide-dark/.test(body);
  return `<div class="stage" id="stage">
    ${body}
    <div class="tt-logo-stage" style="color:${dark ? '#F2F1EE' : '#1A1A1A'}">${LOGO_SMALL}</div>
  </div>`;
};

const FLUID_MAX = 820;
function isFluid() { return S.view === 'slides' && window.innerWidth <= FLUID_MAX; }

function fitStage(wrapSel, win) {
  win = win || window;
  const wrap = win.document.querySelector(wrapSel);
  const st = wrap && wrap.querySelector('.stage');
  if (!st) return;
  const fluid = win === window ? isFluid() : win.innerWidth <= FLUID_MAX;
  if (fluid) { st.style.transform = ''; st.style.left = ''; st.style.top = ''; st.style.position = 'relative'; return; }
  const k = Math.min(wrap.clientWidth / 1280, wrap.clientHeight / 720);
  st.style.transform = `scale(${k})`;
  st.style.left = ((wrap.clientWidth - 1280 * k) / 2) + 'px';
  st.style.top = ((wrap.clientHeight - 720 * k) / 2) + 'px';
  st.style.position = 'absolute';
}

/* ------------------------------------------------------- student window */

function renderSlidesView() {
  document.body.className = 'view-slides' + (window.innerWidth <= FLUID_MAX ? ' fluid' : '');
  const pct = ((S.idx + 1) / deck().length) * 100;
  document.getElementById('app').innerHTML = `
    <div class="progress-thin" style="width:${pct}%"></div>
    <div class="stage-wrap">${stageHTML(S.student, S.idx)}</div>`;
  fitStage('.stage-wrap');
  markScrollable();
}

/* On a phone a long slide scrolls, but nothing tells the student there is more
   below. Fade the bottom edge while there is something left to scroll to. */
function markScrollable() {
  const sl = document.querySelector('.view-slides .slide');
  if (!sl) return;
  const upd = () => {
    const more = sl.scrollHeight - sl.clientHeight - sl.scrollTop > 8;
    sl.classList.toggle('has-more', more);
  };
  sl.addEventListener('scroll', upd, { passive: true });
  requestAnimationFrame(upd);
}

function cueText(t, s) {
  const f = fearById(s.fearId);
  return t.replace(/\{name\}/g, esc(s.name))
          .replace(/\{om\}/g, esc(s.omName))
          .replace(/\{program\}/g, esc(s.program))
          .replace(/\{months\}/g, esc(s.months))
          .replace(/\{outcome\}/g, esc(s.outcome))
          .replace(/\{concern\}/g, esc(s.fearsRaw || (f ? f.slide : 'this')))
          .replace(/\{startDay\}/g, esc(enDate(s.startDate, { weekday: 'long', month: 'long', day: 'numeric' })));
}

  const last = S.idx === list.length - 1;

  document.getElementById('app').innerHTML = `
  <div class="pres">

function renderControls(sl, s) {
  if (sl.controls === 'confirms') {
    return `<div class="p-block"><div class="lbl">Marca en pantalla</div>
      <ul class="pchecks">${CONFIRMS.map(c => `<li class="${S.confirms[c.id] ? 'done' : ''}" onclick="toggleConfirm('${c.id}')"><span class="box">✓</span>${esc(c.k)}</li>`).join('')}</ul></div>`;
  }
  if (sl.controls === 'setup') {
    const branches = SCENARIOS;
    return `<div class="p-block"><div class="lbl">Escenario</div>
        <div class="chips" style="margin-bottom:16px;">${branches.map(b => `<button class="chip ${S.branch === b[0] ? 'on' : ''}" onclick="setBranch('${b[0]}')">${b[1]}</button>`).join('')}</div>
        <div class="lbl">Checklist en vivo</div>
        <ul class="pchecks">${CHECKS.map(c => `<li class="${S.checks[c.id] ? 'done' : ''}" onclick="toggleCheck('${c.id}')"><span class="box">✓</span>${esc(c.t)}</li>`).join('')}</ul>
      </div>`;
  }
  if (sl.controls === 'fear') {
    const f = fearById(s.fearId);
    return `<div class="p-block"><div class="lbl">${f ? 'Preocupación que estamos tratando' : 'Elige lo que acaba de decirte'}</div>
      <div class="chips">${FEARS.map(x => `<button class="chip ${s.fearId === x.id ? 'on' : ''}" onclick="setFear('${x.id}')">${esc(x.chip)}</button>`).join('')}

      ${f ? `<div class="listen" style="margin-top:12px;">${esc(f.ack)}</div>` : ''}</div>`;
  }
  if (sl.controls === 'motivation') {
    return `<div class="p-block"><div class="lbl">Se muestra en la pantalla del estudiante — en segunda persona</div>
      <div class="field" style="margin:0"><textarea id="liveMot" placeholder="Con sus palabras, una o dos líneas." oninput="setLive('motivation', this.value)">${esc(s.motivation)}</textarea>
      <div class="hint" style="margin-top:6px;">Esc cuando termines y las flechas vuelven a funcionar.</div></div></div>`;
  }
  if (sl.controls === 'anchor') {
    return `<div class="p-block"><div class="lbl">Se muestra en la pantalla del estudiante — en segunda persona</div>
      <div class="field" style="margin:0"><textarea id="liveAnc" placeholder="Sacaste adelante a un equipo de 20 personas en una reestructura sin que nadie se fuera." oninput="setLive('anchor', this.value)">${esc(s.anchor)}</textarea>
      <div class="hint" style="margin-top:6px;">Esc cuando termines y las flechas vuelven a funcionar.</div></div></div>`;
  }
  if (sl.controls === 'story') {
    const list = storiesFor(s);
    if (!list.length) return '';
    return `<div class="p-block"><div class="lbl">Qué historia vas a contar</div>
      <div class="chips">${list.map((x, i) => `<button class="chip ${(s.storyIdx || 0) === i ? 'on' : ''}" onclick="setStory(${i})">${esc(x.name)}</button>`).join('')}</div>
      <div class="listen" style="margin-top:12px;">Encaja con: ${esc(list[s.storyIdx || 0].fit)}</div></div>`;
  }
  if (sl.controls === 'commit') {
    return `<div class="p-block"><div class="lbl">Escribe lo que te diga</div>
      <div class="row2">
        <div class="field" style="margin:0"><label>Día</label><input id="cDay" value="${esc(S.commitDay)}" placeholder="martes 16" oninput="setCommit(this.value, null)"></div>
        <div class="field" style="margin:0"><label>Hora</label><input id="cTime" value="${esc(S.commitTime)}" placeholder="8 pm" oninput="setCommit(null, this.value)"></div>
      </div>
      <div class="hint" style="margin-top:8px;">Enter o Esc cuando termines y las flechas vuelven a funcionar.</div></div>`;
  }
  return '';
}

/* --------------------------------------------------------------- actions */

const F = id => document.getElementById(id);

function collectPrep() {
  const s = S.student;
  const g = (id, k) => { if (F(id)) s[k] = F(id).value; };
  g('fName', 'name'); g('fOm', 'omName'); g('fProgram', 'program'); g('fStart', 'startDate');
  g('fEmail', 'email'); g('fMonths', 'months');
  g('fMotivation', 'motivation'); g('fAnchor', 'anchor'); g('fFears', 'fearsRaw');
  g('fBackground', 'background');
}

function doParse() {
  const txt = F('gPaste').value;
  if (!txt.trim()) return toast('Primero pega el resumen');
  const p = parseGlyphic(txt);
  const keys = { motivation: 'fMotivation', anchor: 'fAnchor', fearsRaw: 'fFears', background: 'fBackground' };
  let n = 0;
  for (const k in keys) if (p[k]) { F(keys[k]).value = p[k]; n++; }
  collectPrep();
  S.student.fearId = guessFear([p.fearsRaw, p.background].join(' ')) || '';
  const guess = S.student.fearId;
  renderPrep();
  toast(n ? n + ' campo(s) completados' + (guess ? ' · preocupación sugerida' : '') : 'No reconocí el formato, revisa las etiquetas');
}

function clearGlyphic() {
  collectPrep();
  const s = S.student;
  s.motivation = ''; s.anchor = ''; s.fearsRaw = ''; s.background = ''; s.fearId = '';
  renderPrep();
  toast('Modo captura en vivo: se lo preguntarás en la llamada');
}

function courseChanged() {
  collectPrep();
  const c = COURSES[F('fProgram').value];
  if (!c) return;
  S.student.months = c.months;
  S.student.outcome = c.outcome;
  S.student.storyIdx = 0;
  renderPrep();
}

/* Downloads the exact file currently being served, so the offline backup can't
   drift from the hosted version. Only works over http(s) — from a local file
   the browser refuses to read itself. */
async function saveOffline() {
  try {
    const res = await fetch(location.pathname);
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'onboarding-call-' + BUILD + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Guardado. Déjalo en Descargas como respaldo');
  } catch (e) {
    toast('Abre el enlace publicado para guardar una copia');
  }
}

function loadSample() { S.student = Object.assign({}, SAMPLE); renderPrep(); toast('Ejemplo cargado'); }
function loadBlank() { S.student = Object.assign({}, BLANK); renderPrep(); toast('Formulario vacío'); }
function startCall() {
  collectPrep();
  S.idx = 0;
  const st = S.student;
  st.motivationPrefilled = !!String(st.motivation || '').trim();
  st.anchorPrefilled = !!String(st.anchor || '').trim();
  st.fearPrefilled = !!st.fearId;   // picked before the call, vs. asked during it
  go('presenter');
}
function resetAll() {
  S.checks = {}; S.confirms = {}; S.commitDay = ''; S.commitTime = '';
  S.timerStart = null; S.timerNow = 0; S.idx = 0; S.branch = 'B';
  go('prep');
}

function setIdx(i) { if (i < 0 || i >= deck().length) return; S.idx = i; if (!S.timerStart && i > 0) S.timerStart = Date.now(); paint(); }
function next() { setIdx(S.idx + 1); }
function prev() { setIdx(S.idx - 1); }
function setBranch(b) { S.branch = b; paint(); }
function setStory(i) { S.student.storyIdx = i; if (S.view === 'prep') renderPrep(); else paint(); }
function setFear(id) { S.student.fearId = id; if (S.view === 'prep') renderPrep(); else paint(); }
function toggleCheck(id) { S.checks[id] = !S.checks[id]; paint(); }
function toggleConfirm(id) { S.confirms[id] = !S.confirms[id]; paint(); }

/* live typing must not re-render the panel, or the field loses focus */
function refreshStageOnly() {
  pushStudent();
  const st = document.querySelector('.pres-preview .stage-wrap');
  if (st) { st.innerHTML = stageHTML(S.student, S.idx); fitStage('.pres-preview .stage-wrap'); }
}
function setCommit(d, t) {
  if (d !== null) S.commitDay = d;
  if (t !== null) S.commitTime = t;
  refreshStageOnly();
}
function setLive(field, value) { S.student[field] = value; refreshStageOnly(); }
function toggleTimer() { S.timerStart = S.timerStart ? null : Date.now() - S.timerNow * 1000; paint(); }

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast('Copiado')).catch(() => toast('Cópialo manualmente (Ctrl+C)'));
}
function copyFrom(id) { const e = F(id); e.select(); copyText(e.value); }

let toastT;
function toast(msg) {
  const el = F('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ------------------------------------------------- two-window transport */

let childWin = null;
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('om_call') : null;

function pushStudent() {
  const payload = { type: 'state', S: { idx: S.idx, student: S.student, checks: S.checks, confirms: S.confirms, branch: S.branch, commitDay: S.commitDay, commitTime: S.commitTime } };
  if (bc) bc.postMessage(payload);
  try { if (childWin && !childWin.closed) childWin.postMessage(payload, '*'); } catch (e) {}
  renderChild();
}
function applyState(x) {
  S.idx = x.idx; S.student = x.student; S.checks = x.checks; S.confirms = x.confirms;
  S.branch = x.branch; S.commitDay = x.commitDay; S.commitTime = x.commitTime;
  if (S.view === 'slides') renderSlidesView();
}
if (bc) bc.onmessage = e => {
  const d = e.data;
  if (d.type === 'state' && S.view === 'slides') applyState(d.S);
  if (d.type === 'hello' && S.view === 'presenter') pushStudent();
};
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'state' && S.view === 'slides') applyState(d.S);
  if (d.type === 'hello' && S.view === 'presenter') pushStudent();
});

/* A tab, not a popup — window.open with no size features opens a tab, and this
   runs from a click, so the popup blocker doesn't apply. In Meet share
   "Chrome tab" and pick it: it keeps being shared while the OM looks at this
   panel, with Meet's picture-in-picture floating the student's face on top. */
function openStudent() {
  childWin = window.open('', 'om_student');
  if (!childWin) return toast('El navegador bloqueó la pestaña: revisa la configuración del sitio');
  const css = Array.prototype.map.call(document.querySelectorAll('style'), n => n.textContent).join('\n');
  const d = childWin.document;
  d.open();
  d.write('<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">' +
          '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
          '<title>TripleTen</title><style>' + css + '</style></head>' +
          '<body data-accent="orange"><div id="app"></div></body></html>');
  d.close();
  childWin.addEventListener('resize', renderChild);
  renderChild();
  toast('En Meet: comparte pestaña de Chrome → esa pestaña');
}

/* Renders the student slide straight into the child window's DOM. */
function renderChild() {
  if (!childWin || childWin.closed) return;
  let d, app;
  try { d = childWin.document; app = d.getElementById('app'); } catch (e) { return; }
  if (!app) return;   // a window opened by URL renders itself instead
  d.body.className = 'view-slides' + (childWin.innerWidth <= FLUID_MAX ? ' fluid' : '');
  const pct = ((S.idx + 1) / deck().length) * 100;
  app.innerHTML = '<div class="progress-thin" style="width:' + pct + '%"></div>' +
                  '<div class="stage-wrap">' + stageHTML(S.student, S.idx) + '</div>';
  fitStage('.stage-wrap', childWin);
  const sl = d.querySelector('.slide');
  if (sl) {
    const upd = () => sl.classList.toggle('has-more', sl.scrollHeight - sl.clientHeight - sl.scrollTop > 8);
    sl.addEventListener('scroll', upd, { passive: true });
    childWin.requestAnimationFrame(upd);
  }
}

/* ------------------------------------------------------------- lifecycle */

function paint() {
  if (S.view === 'presenter') renderPresenter();
  else if (S.view === 'slides') renderSlidesView();
  else if (S.view === 'handoff') renderHandoff();
  else renderPrep();
  if (S.view === 'presenter') fitStage('.pres-preview .stage-wrap');
  pushStudent();
}
function go(v) { S.view = v; paint(); }

document.addEventListener('keydown', e => {
  if (S.view === 'prep') return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') {
    /* arrows move the caret inside a field, so nothing advances while the OM is
       typing. Esc anywhere, or Enter in a single-line field, hands the keyboard
       back to the deck. */
    if (e.key === 'Escape' || (e.key === 'Enter' && tag === 'input')) { e.preventDefault(); e.target.blur(); }
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key.toLowerCase() === 't' && S.view === 'presenter') toggleTimer();
  else if (e.key.toLowerCase() === 'f' && S.view === 'presenter') go('handoff');
  else if (e.key === 'Home') setIdx(0);
  else if (e.key === 'End') setIdx(deck().length - 1);
});

window.addEventListener('resize', () => {
  if (S.view === 'slides') { renderSlidesView(); return; }   // fluid ↔ scaled needs a re-render
  fitStage('.pres-preview .stage-wrap');
});

setInterval(() => {
  if (!S.timerStart) return;
  S.timerNow = Math.floor((Date.now() - S.timerStart) / 1000);
  const t = document.querySelector('.timer');
  if (t && S.view === 'presenter') {
    const mm = Math.floor(S.timerNow / 60), ss = String(S.timerNow % 60).padStart(2, '0');
    t.innerHTML = `${mm}:${ss} <span class="tgt">/ ${CALL_MINUTES}′</span>`;
    t.className = 'timer ' + (S.timerNow / 60 > CALL_MINUTES ? 'over' : (S.timerNow / 60 > CALL_MINUTES - 3 ? 'warn' : ''));
  }
}, 1000);

/* boot */
S.view = qs('view') || 'prep';
if (S.view === 'slides') { if (bc) bc.postMessage({ type: 'hello' }); try { if (window.opener) window.opener.postMessage({ type: 'hello' }, '*'); } catch (e) {} }
paint();

</script>
</body>
</html>
